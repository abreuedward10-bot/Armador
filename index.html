<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Montador Jennyfit</title>
    
    <!-- Etiquetas para que funcione como App (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0d0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --verde: #39FF14; --fondo: #0b0d0c; --caja: #18181b; --borde: #3f3f46; }
        /* Ajuste para que los botones no tapen la barra de gestos de Android */
        body { background-color: var(--fondo); color: #f4f4f5; font-family: system-ui, sans-serif; padding: 10px; margin: 0; padding-bottom: calc(250px + env(safe-area-inset-bottom)); }
        h1 { color: var(--verde); font-size: 1.3rem; text-align: center; margin-bottom: 5px; }
        p.sub { text-align: center; color: #a1a1aa; font-size: 0.8rem; margin-top: 0; margin-bottom: 15px; }
        
        .upload-zone { background: #18181b; border: 2px dashed #8b5cf6; border-radius: 10px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .upload-zone h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #a1a1aa; }
        .btn-upload { display: inline-block; width: 100%; padding: 12px; background: #8b5cf6; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; box-sizing: border-box; margin-bottom: 8px; font-size: 0.9rem; }
        .btn-folder { background: #06b6d4; color: #000; }
        input[type="file"] { display: none; }

        details { background: var(--caja); border: 1px solid var(--borde); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        details[open] { border-color: var(--verde); box-shadow: 0 0 10px rgba(57, 255, 20, 0.1); }
        summary { padding: 12px; font-size: 0.85rem; font-weight: bold; color: var(--verde); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼ Editar'; color: #a1a1aa; font-size: 0.7rem; font-weight: normal; }
        details[open] summary::after { content: '▲ Cerrar'; }

        textarea { 
            width: 100%; height: 150px; background: #86efac; color: #000000; 
            border: none; border-top: 1px solid var(--borde); border-bottom: 1px solid var(--borde);
            padding: 10px; font-family: monospace; font-size: 0.8rem; resize: vertical; box-sizing: border-box;
        }
        textarea:focus { outline: none; }
        
        .box-tools { display: flex; gap: 5px; padding: 10px; background: #121214; }
        .box-tools button { flex: 1; padding: 12px 5px; border: none; border-radius: 4px; font-size: 0.8rem; font-weight: bold; cursor: pointer; color: white; }
        .btn-paste { background: #06b6d4; color: #000 !important; }
        .btn-undo { background: #f59e0b; color: #000 !important; }
        .btn-clear { background: #ef4444; }

        /* Controles inferiores anclados con margen de seguridad */
        .controls { background: var(--caja); padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); position: fixed; bottom: 0; left: 0; right: 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.9); border-top: 1px solid var(--verde); z-index: 100; }
        .progress-bar { width: 100%; height: 5px; background: #27272a; border-radius: 3px; margin-bottom: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--verde); width: 0%; transition: 0.3s; }
        .status-text { font-size: 0.75rem; color: #a1a1aa; text-align: center; margin-bottom: 8px; display: block; font-weight: bold; }
        
        input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--borde); background: #09090b; color: white; box-sizing: border-box; font-size: 0.9rem; margin-bottom: 8px; text-align: center; }
        
        .btn-group { display: flex; gap: 6px; margin-bottom: 6px; }
        .btn-group:last-child { margin-bottom: 0; }
        .btn-group button { flex: 1; padding: 12px 5px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-main { background: var(--verde); color: #051405; }
        .btn-zip { background: #8b5cf6; color: white; }
        .btn-save { background: #eab308; color: #000; }
        .btn-secondary { background: #3f3f46; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        
        #empty-msg { text-align: center; color: #a1a1aa; margin-top: 20px; font-size: 0.9rem; display: none; }
        .ultimo-archivo { color: #f59e0b !important; background: #2a1f05; border-bottom: 2px solid #f59e0b; }
    </style>
</head>
<body>

    <h1>Montador Jennyfit</h1>
    <p class="sub">Sube tus archivos. Se ordenarán solos.</p>

    <div class="upload-zone">
        <h3>OPCIÓN 1: Recomendada (Sube un .ZIP)</h3>
        <label class="btn-upload" for="zip-input">🗜️ Cargar archivo .ZIP</label>
        <input type="file" id="zip-input">
        
        <h3 style="margin-top: 15px;">OPCIÓN 2: Subir Carpeta</h3>
        <label class="btn-upload btn-folder" for="folder-input">📁 Seleccionar Carpeta</label>
        <input type="file" id="folder-input" webkitdirectory directory multiple>
    </div>

    <div id="blocks-container"></div>
    <div id="empty-msg">No hay archivos cargados. Sube un .ZIP o una Carpeta.</div>

    <div class="controls">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="status-text" id="status-text">Listo para trabajar</span>
        
        <input type="text" id="filename" value="index" placeholder="Nombre del archivo final">
        
        <div class="btn-group">
            <button class="btn-main" onclick="descargarHTML()">⬇️ Bajar HTML</button>
            <button class="btn-zip" onclick="descargarZIP()">📦 Bajar ZIP</button>
        </div>
        
        <div class="btn-group">
            <button class="btn-save" onclick="exportarProyecto()">💾 Guardar Progreso</button>
            <button class="btn-secondary" onclick="document.getElementById('json-input').click()">📂 Cargar Progreso</button>
            <input type="file" id="json-input" accept=".json" style="display:none" onchange="importarProyecto(event)">
            <button class="btn-danger" onclick="resetearTodo()" style="flex: 0.5;">🗑️</button>
        </div>
    </div>

    <script>
        // --- REGISTRO DE LA APP (PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('App lista para funcionar offline'))
                    .catch(err => console.log('Error al registrar App:', err));
            });
        }

        let bloquesActuales = []; 
        const container = document.getElementById('blocks-container');
        const emptyMsg = document.getElementById('empty-msg');
        let db;

        if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
        const request = indexedDB.open("MontadorDB", 7); 
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("estado")) db.createObjectStore("estado");
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            cargarDesdeDB();
        };

        function renderizar() {
            container.innerHTML = '';
            
            if (bloquesActuales.length === 0) {
                emptyMsg.style.display = 'block';
                actualizarProgreso();
                return;
            }
            
            emptyMsg.style.display = 'none';
            bloquesActuales.sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true, sensitivity: 'base' }));

            bloquesActuales.forEach((bloque, i) => {
                const details = document.createElement('details');
                details.id = 'container-' + i;
                
                const summary = document.createElement('summary');
                const esElUltimo = (i === bloquesActuales.length - 1);
                
                if (esElUltimo) {
                    summary.classList.add('ultimo-archivo');
                    summary.innerText = `[${i + 1}] ${bloque.nombre} 👈 ÚLTIMO`;
                } else {
                    summary.innerText = `[${i + 1}] ${bloque.nombre}`;
                }
                
                const textarea = document.createElement('textarea');
                textarea.value = bloque.contenido;
                
                textarea.addEventListener('input', (e) => { e.target.style.background = '#ef4444'; e.target.style.color = '#ffffff';
                    bloque.contenido = e.target.value;
                    guardarEnDB();
                    actualizarProgreso();
                });

                const tools = document.createElement('div');
                tools.className = 'box-tools';

                const btnPaste = document.createElement('button');
                btnPaste.className = 'btn-paste';
                btnPaste.innerText = '📋 Pegar';
                btnPaste.onclick = async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        textarea.focus(); 
                        const start = textarea.selectionStart;
                        const end = textarea.selectionEnd;
                        textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
                        textarea.dispatchEvent(new Event('input'));
                    } catch (err) {
                        alert("Mantén presionado dentro del texto y selecciona 'Pegar'.");
                    }
                };

                const btnUndo = document.createElement('button');
                btnUndo.className = 'btn-undo';
                btnUndo.innerText = '↩️ Deshacer';
                btnUndo.onclick = () => { textarea.focus(); document.execCommand('undo'); textarea.dispatchEvent(new Event('input')); };

                const btnClear = document.createElement('button');
                btnClear.className = 'btn-clear';
                btnClear.innerText = '🗑️ Borrar';
                btnClear.onclick = () => {
                    if(confirm('¿Borrar el contenido de esta casilla?')) {
                        textarea.value = '';
                        textarea.dispatchEvent(new Event('input'));
                    }
                };

                tools.appendChild(btnPaste);
                tools.appendChild(btnUndo);
                tools.appendChild(btnClear);

                details.appendChild(summary);
                details.appendChild(textarea);
                details.appendChild(tools);
                container.appendChild(details);
            });
            
            actualizarProgreso();
        }

        function guardarEnDB() {
            if (db) {
                const tx = db.transaction("estado", "readwrite");
                tx.objectStore("estado").put(bloquesActuales, "lista_bloques");
            }
            localStorage.setItem('jf_filename', document.getElementById('filename').value);
        }

        function cargarDesdeDB() {
            if (!db) return;
            const tx = db.transaction("estado", "readonly");
            const store = tx.objectStore("estado");
            const req = store.get("lista_bloques");
            
            req.onsuccess = () => {
                if (req.result) {
                    bloquesActuales = req.result;
                    document.getElementById('filename').value = localStorage.getItem('jf_filename') || 'index';
                    renderizar();
                } else {
                    renderizar();
                }
            };
        }

        function procesarNuevosArchivos(nuevosBloques) {
            bloquesActuales = nuevosBloques;
            renderizar();
            guardarEnDB();
        }

        document.getElementById('folder-input').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            
            const txtFiles = files.filter(f => f.name.toLowerCase().endsWith('.txt') && !f.name.startsWith('.'));
            
            if(!confirm(`⚠️ Se borrarán los anteriores. ¿Cargar ${txtFiles.length} archivos .txt?`)) return;

            document.getElementById('status-text').innerText = `Leyendo carpeta...`;
            let nuevos = [];
            let procesados = 0;

            txtFiles.forEach((file) => {
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    nuevos.push({ nombre: file.name, contenido: event.target.result });
                    procesados++;
                    if (procesados === txtFiles.length) {
                        procesarNuevosArchivos(nuevos);
                        setTimeout(() => actualizarProgreso(), 100); try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); osc.frequency.value = 880; osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3); } catch(e){} alert("✅ ¡Cargado con éxito!"); 
                    }
                };
                
                reader.onerror = () => {
                    procesados++;
                    if (procesados === txtFiles.length) {
                        procesarNuevosArchivos(nuevos);
                        setTimeout(() => actualizarProgreso(), 100); try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); osc.frequency.value = 880; osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3); } catch(e){} alert("✅ ¡Cargado con éxito!");
                    }
                };

                reader.readAsText(file);
            });
            e.target.value = '';
        });

        document.getElementById('zip-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if(!confirm("⚠️ Se borrarán los anteriores. ¿Continuar?")) return;
            
            document.getElementById('status-text').innerText = 'Descomprimiendo ZIP...'; document.getElementById('filename').value = file.name.replace(/\.zip$/i, ''); document.getElementById('filename').style.background = '#86efac'; document.getElementById('filename').style.color = '#000000';
            
            try {
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                let nuevos = [];

                for (const filename of Object.keys(contents.files)) {
                    if (filename.toLowerCase().endsWith('.txt') && !filename.startsWith('__MACOSX')) {
                        const text = await contents.files[filename].async("string");
                        const nombreLimpio = filename.split('/').pop();
                        nuevos.push({ nombre: nombreLimpio, contenido: text });
                    }
                }
                
                procesarNuevosArchivos(nuevos);
                setTimeout(() => actualizarProgreso(), 100); try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); osc.frequency.value = 880; osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3); } catch(e){} alert("✅ ¡Cargado con éxito!");
            } catch (error) {
                alert("Error al leer el ZIP.");
                document.getElementById('status-text').innerText = 'Error con el ZIP.';
            }
            e.target.value = '';
        });

        function actualizarProgreso() {
            if (bloquesActuales.length === 0) {
                document.getElementById('progress-fill').style.width = '0%';
                document.getElementById('status-text').innerText = 'Esperando archivos...';
                return;
            }
            let llenos = bloquesActuales.filter(b => b.contenido && b.contenido.trim() !== '').length;
            document.getElementById('progress-fill').style.width = `${(llenos / bloquesActuales.length) * 100}%`;
            document.getElementById('status-text').innerText = `Progreso: ${llenos}/${bloquesActuales.length} | En lista: ${bloquesActuales.length}`;
        }

        function descargarHTML() {
            if (bloquesActuales.length === 0) return alert("No hay archivos cargados.");
            let contenidoFinal = '';
            bloquesActuales.sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true, sensitivity: 'base' }));
            
            bloquesActuales.forEach(b => {
                if (b.contenido) contenidoFinal += b.contenido + '\n';
            });

            const nombre = document.getElementById('filename').value.trim() || 'index';
            const blob = new Blob([contenidoFinal], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${nombre}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function descargarZIP() {
            if (bloquesActuales.length === 0) return alert("No hay archivos cargados.");
            const zip = new JSZip();
            bloquesActuales.sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, { numeric: true, sensitivity: 'base' }));

            bloquesActuales.forEach(b => {
                if (b.contenido && b.contenido.trim() !== '') {
                    zip.file(b.nombre, b.contenido);
                }
            });
            
            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            const nombreZip = document.getElementById('filename').value.trim() || 'Partes_Ordenadas';
            a.download = `${nombreZip}.zip`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function resetearTodo() {
            if (confirm("¿Seguro que quieres borrar TODO el progreso?")) {
                bloquesActuales = [];
                if (db) {
                    const tx = db.transaction("estado", "readwrite");
                    tx.objectStore("estado").delete("lista_bloques");
                }
                localStorage.clear();
                renderizar();
                document.getElementById('status-text').innerText = 'Todo borrado.';
            }
        }

        function exportarProyecto() {
            if (bloquesActuales.length === 0) return alert("No hay nada que guardar.");
            const proyecto = { bloques: bloquesActuales, filename: document.getElementById('filename').value };
            const blob = new Blob([JSON.stringify(proyecto, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Respaldo_Montador.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importarProyecto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.bloques) {
                        bloquesActuales = data.bloques;
                        document.getElementById('filename').value = data.filename || 'index';
                        renderizar();
                        guardarEnDB();
                        alert("¡Progreso restaurado!");
                    }
                } catch (err) {
                    alert("Error al leer el archivo de respaldo.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }
    </script>
</body>
</html>
